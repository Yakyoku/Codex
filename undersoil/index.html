<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>UNDERSOIL</title>
<meta name="theme-color" content="#0b0907">
</head>
<body class="stage">
<canvas id="view"></canvas>
<div class="hud" id="hud">起動中…</div>
<nav class="nav">
  <button class="btn" id="mute">音：入</button>
  <button class="btn" id="settings">設定</button>
  <button class="btn" id="fs">全画面</button>
  <a class="btn" id="toVR" href="./vr/">VR で遊ぶ</a>
  <a class="btn" href="./diag/">実機診断</a>
  <a class="btn" href="./progress/">進捗</a>
</nav>
<div class="scale-tag"><b></b>0.1 mm（髪の毛の太さほど）</div>
<div class="vital">土の活力 <span id="vitNum">0</span>%<div class="bar"><i id="vitBar"></i></div></div>
<div class="actions">
  <button class="btn primary" id="water">水を運ぶ</button>
  <button class="btn" id="dry">乾かす</button>
  <button class="btn" id="tour">自分で動く</button>
  <button class="btn" id="sprout">地上を見る</button>
</div>
<div class="stick" id="stick"><i></i></div>
<div class="loading" id="loading">
  <h1>UNDERSOIL</h1>
  <div class="sub">土の下の、小さな春</div>
  <div class="bar"><i id="loadBar"></i></div>
  <div class="fact" id="fact"></div>
  <button class="btn primary" id="start" hidden>クリックして開始</button>
</div>
<script type="module" src="/src/pages/screen.ts"></script>
</body>
</html>
