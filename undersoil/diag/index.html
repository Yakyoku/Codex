<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNDERSOIL 実機診断</title>
<meta name="theme-color" content="#0b0907">
</head>
<body class="diag">
<div class="wrap">
  <h1>UNDERSOIL 実機診断</h1>
  <p>開くと自動で測ります。終わったら「結果をコピー」を押して、そのまま Claude に貼り付けてください。計測中は、この画面を開いたままにしてください。</p>
  <canvas id="view"></canvas>
  <div id="status">起動中…</div>
  <table><tbody id="rows"></tbody></table>
  <p id="sndState" style="color:var(--dim);font-size:14px;margin:10px 0 0"></p>
  <textarea id="short" readonly placeholder="ここに結果が出ます"></textarea>
  <div class="row">
    <button class="btn primary" id="send" disabled>結果を送る</button>
    <button class="btn" id="copy" disabled>結果をコピー</button>
    <button class="btn" id="reAuto">自動で測り直す</button>
    <button class="btn" id="reGPU">WebGPU で測る</button>
    <button class="btn" id="reGL">WebGL 2 で測る</button>
    <button class="btn" id="snd">音を鳴らす</button>
    <a class="btn" href="../">画面版へ</a>
    <a class="btn" href="../vr/">VR 版へ</a>
  </div>
</div>
<script type="module" src="/src/pages/diag.ts"></script>
<!-- 実機診断の結果を Netlify のフォームで受け取る（貼り付けなくても、Claude が読める）。Netlify がこの形を読み取るための、隠したフォーム -->
<form name="diag" data-netlify="true" netlify-honeypot="bot" hidden><input name="result"><input name="note"><input name="bot"></form>
</body>
</html>
