<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNDERSOIL 全体の進み具合</title>
<meta name="theme-color" content="#0b0907">
<style>
  :root { --bg: #0d0a08; --panel: #17120e; --line: rgba(239, 230, 216, .14); --ink: #efe6d8; --dim: #b3a792; --accent: #d9a441; --done: #6fae6a; --part: #d9a441; --todo: #4a4036; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.7 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 28px 16px 64px; }
  header h1 { font-size: clamp(22px, 3.4vw, 32px); letter-spacing: .12em; margin: 0; font-weight: 600; }
  header p { color: var(--dim); margin: 6px 0 0; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
  .links a { color: var(--ink); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  .links a:hover { border-color: var(--accent); }
  .hero { display: grid; grid-template-columns: 180px 1fr; gap: 24px; align-items: center; margin: 26px 0; padding: 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); }
  .ring { position: relative; width: 180px; height: 180px; }
  .ring svg { transform: rotate(-90deg); }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 38px; font-weight: 700; }
  .ring b small { display: block; font-size: 12px; color: var(--dim); font-weight: 500; text-align: center; margin-top: -40px; }
  .hero h2 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
  .hero .now { color: var(--accent); font-weight: 700; font-size: 17px; }
  .hero .note { color: var(--dim); font-size: 12.5px; margin-top: 10px; }
  .track { display: flex; height: 26px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); margin: 6px 0 4px; }
  .track > div { position: relative; border-right: 1px solid var(--bg); background: var(--todo); }
  .track > div i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--done); }
  .track > div.cur { outline: 2px solid var(--accent); outline-offset: -2px; z-index: 1; }
  .track > div span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 0 3px #000; white-space: nowrap; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--dim); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  section.box { margin: 22px 0; padding: 18px 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); }
  section.box h2 { margin: 0 0 10px; font-size: 17px; font-weight: 600; letter-spacing: .06em; }
  ol.next, ul.wait { margin: 0; padding-left: 1.3em; } ol.next li, ul.wait li { margin: 4px 0; }
  .ms { margin: 14px 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--panel); }
  .ms > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: grid; grid-template-columns: 64px 1fr 120px; gap: 12px; align-items: center; }
  .ms > summary::-webkit-details-marker { display: none; }
  .ms .id { font-weight: 800; font-size: 18px; color: var(--accent); }
  .ms .nm { font-weight: 600; } .ms .nm small { display: block; color: var(--dim); font-weight: 400; font-size: 12.5px; line-height: 1.5; }
  .ms .pc { text-align: right; } .ms .pc b { font-size: 20px; } .ms .pc .bar { height: 6px; border-radius: 3px; background: var(--todo); margin-top: 4px; overflow: hidden; } .ms .pc .bar i { display: block; height: 100%; background: var(--done); }
  .ms.cur { border-color: rgba(217, 164, 65, .7); }
  .ms ul { list-style: none; margin: 0; padding: 0 18px 14px; }
  .ms li { display: grid; grid-template-columns: 22px 1fr 44px; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); }
  .ms li .st { width: 16px; height: 16px; border-radius: 50%; margin-top: 4px; border: 2px solid var(--todo); }
  .ms li .st.d { background: var(--done); border-color: var(--done); } .ms li .st.p { background: conic-gradient(var(--part) var(--a), transparent 0); border-color: var(--part); }
  .ms li em { font-style: normal; display: block; color: var(--dim); font-size: 12.5px; line-height: 1.5; }
  .ms li .v { text-align: right; color: var(--dim); font-size: 12.5px; }
  .sub { color: var(--dim); font-size: 13px; margin: -4px 0 10px; }
  .dtab table { width: 100%; border-collapse: collapse; font-size: 13.5px; } .dtab th, .dtab td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; } .dtab th { color: var(--dim); font-weight: 500; white-space: nowrap; }
  .thumb { width: 64px; height: 44px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); cursor: zoom-in; margin-top: 4px; display: block; }
  #lb { background: #17120e; color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 12px; max-width: min(96vw, 1100px); } #lb::backdrop { background: rgba(0,0,0,.7); } #lb img { display: block; max-width: 100%; max-height: 78vh; border-radius: 8px; } #lb p { margin: 8px 2px; } #lb button { font: inherit; color: var(--ink); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; cursor: pointer; }
  .hist { list-style: none; margin: 0; padding: 0; } .hist li { padding: 5px 0; border-top: 1px solid var(--line); font-size: 14px; } .hist b { color: var(--dim); font-weight: 500; margin-right: 10px; }
  @media (max-width: 640px) { .hero { grid-template-columns: 1fr; justify-items: center; text-align: center; } .ms > summary { grid-template-columns: 48px 1fr 70px; } .track > div span { font-size: 9px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>UNDERSOIL 全体の進み具合</h1>
    <p>依頼文（要件定義）の全体のうち、どこまで進んでいるか。<span id="upd"></span></p>
    <div class="links"><a href="../">ゲーム（画面版）</a><a href="../vr/">VR 版</a><a href="../progress/">進捗（画像・動画）</a><a href="../diag/">実機診断</a></div>
  </header>
  <div class="hero">
    <div class="ring"><svg width="180" height="180" viewBox="0 0 180 180"><circle cx="90" cy="90" r="76" fill="none" stroke="#4a4036" stroke-width="16"/><circle id="arc" cx="90" cy="90" r="76" fill="none" stroke="#6fae6a" stroke-width="16" stroke-linecap="round" stroke-dasharray="0 999"/></svg><b><span id="pct">–</span></b></div>
    <div>
      <h2>全体のうち <span id="pct2"></span> まで</h2>
      <div>いまの段階：<span class="now" id="now"></span></div>
      <div class="track" id="track"></div>
      <div class="legend"><span><i style="background:var(--done)"></i>できた分</span><span><i style="background:var(--todo)"></i>これから</span><span><i style="background:none;outline:2px solid var(--accent)"></i>いまの段階</span></div>
      <div class="note" id="wnote"></div>
    </div>
  </div>
  <section class="box"><h2>次にやること</h2><ol class="next" id="next"></ol></section>
  <section class="box"><h2>持ち主の確認・決定を待っていること</h2><ul class="wait" id="wait"></ul></section>
  <div id="ms"></div>
  <section class="box"><h2>実機診断の結果</h2><p class="sub">実機診断ページの「結果を送る」で届いた結果と、そのあとの対応です。</p><div class="dtab" id="diag"></div></section>
  <section class="box"><h2>これまでの歩み</h2><ul class="hist" id="hist"></ul></section>
</main>
<dialog id="lb"><img alt=""><p></p><button type="button" onclick="this.closest('dialog').close()">とじる</button></dialog>
<script>
fetch('./data.json', { cache: 'no-store' }).then((r) => r.json()).then((d) => {
  const $ = (id) => document.getElementById(id);
  const pctOf = (m) => m.items.reduce((s, it) => s + it.s, 0) / m.items.length;
  const total = d.milestones.reduce((s, m) => s + m.weight * pctOf(m), 0) / d.milestones.reduce((s, m) => s + m.weight, 0);
  const P = Math.round(total * 100);
  $('pct').textContent = P + '%'; $('pct2').textContent = '約 ' + P + '%';  $('upd').textContent = '（最終更新 ' + d.updated + '）'; $('wnote').textContent = d.weightsNote;
  const C = 2 * Math.PI * 76; $('arc').setAttribute('stroke-dasharray', (C * total).toFixed(1) + ' 999');
  const curId = (d.now.match(/M\d/) || [''])[0]; const curM = d.milestones.find((m) => m.id === curId);
  $('now').textContent = d.now + (curM ? `（約 ${Math.round(pctOf(curM) * 100)}%）` : '');
  $('track').innerHTML = d.milestones.map((m) => `<div class="${m.id === curId ? 'cur' : ''}" style="flex:${m.weight}"><i style="width:${(pctOf(m) * 100).toFixed(0)}%"></i><span>${m.id}</span></div>`).join('');
  $('next').innerHTML = d.next.map((t) => `<li>${t}</li>`).join('');
  $('wait').innerHTML = d.waiting.map((t) => `<li>${t}</li>`).join('');
  $('ms').innerHTML = d.milestones.map((m) => { const p = pctOf(m); return `<details class="ms ${m.id === curId ? 'cur' : ''}" ${m.id === curId ? 'open' : ''}>
    <summary><span class="id">${m.id}</span><span class="nm">${m.name}<small>${m.summary}</small></span><span class="pc"><b>${Math.round(p * 100)}%</b><div class="bar"><i style="width:${p * 100}%"></i></div></span></summary>
    <ul>${m.items.map((it) => `<li><span class="st ${it.s >= 1 ? 'd' : it.s > 0 ? 'p' : ''}" style="--a:${it.s * 360}deg"></span><span>${it.t}${it.note ? `<em>${it.note}</em>` : ''}${it.img ? `<img class="thumb" src="${it.img}" alt="" data-cap="${it.t}" loading="lazy">` : ''}</span><span class="v">${it.s >= 1 ? '完了' : it.s > 0 ? Math.round(it.s * 100) + '%' : '未着手'}</span></li>`).join('')}</ul></details>`; }).join('');
  $('diag').innerHTML = (d.diag || []).length ? `<table><tr><th>日付</th><th>機器</th><th>三角形</th><th>なめらかさ（fps）</th><th>エラー</th><th>対応</th></tr>${d.diag.map((x) => `<tr><td>${x.d}</td><td>${x.dev}<br><small>${x.tier}</small></td><td>${x.tri}</td><td>${x.fps}</td><td>${x.err}</td><td>${x.action}</td></tr>`).join('')}</table>` : 'まだありません';
  document.addEventListener('click', (e) => { const t = e.target; if (t.classList && t.classList.contains('thumb')) { e.preventDefault(); const lb = $('lb'); lb.querySelector('img').src = t.src; lb.querySelector('p').textContent = t.dataset.cap; lb.showModal(); } });
  $('hist').innerHTML = d.history.map((h) => `<li><b>${h.d}</b>${h.t}</li>`).join('');
});
</script>
</body>
</html>
